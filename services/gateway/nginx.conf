upstream auth_service    { server auth_service:8001;    }
upstream upload_service  { server upload_service:8002;  }
upstream analysis_service{ server analysis_service:8003; }
upstream gradcam_service { server gradcam_service:8004; }
upstream report_service  { server report_service:8005;  }
upstream frontend        { server frontend:3000;        }

# Rate-limit zones
limit_req_zone $binary_remote_addr zone=auth_rl:10m    rate=10r/m;   # login/register (brute-force guard)
limit_req_zone $binary_remote_addr zone=refresh_rl:10m rate=30r/m;   # token refresh (legit, more frequent)
limit_req_zone $binary_remote_addr zone=upload_rl:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_rl:10m     rate=120r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # Throttled requests get 429 (Too Many Requests), not nginx's default 503.
    limit_req_status 429;

    # ── Auth ──────────────────────────────────────────────────────────────
    # Token refresh is a legitimate, more-frequent call — keep it off the strict
    # login/register zone. More specific prefix wins over /api/v1/auth/ below.
    location /api/v1/auth/refresh {
        limit_req zone=refresh_rl burst=10 nodelay;
        proxy_pass         http://auth_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_rl burst=5 nodelay;
        proxy_pass         http://auth_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /api/v1/users/ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass         http://auth_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /api/v1/admin/ {
        limit_req zone=api_rl burst=10 nodelay;
        proxy_pass         http://auth_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Upload ────────────────────────────────────────────────────────────
    location /api/v1/upload {
        limit_req zone=upload_rl burst=10 nodelay;
        proxy_pass         http://upload_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Analysis ──────────────────────────────────────────────────────────
    location /api/v1/analyze {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass         http://analysis_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /api/v1/results/ {
        limit_req zone=api_rl burst=30 nodelay;
        proxy_pass         http://analysis_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── GradCAM ───────────────────────────────────────────────────────────
    location /api/v1/explain {
        limit_req zone=api_rl burst=10 nodelay;
        proxy_pass         http://gradcam_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Reports ───────────────────────────────────────────────────────────
    location /api/v1/reports/ {
        limit_req zone=api_rl burst=10 nodelay;
        proxy_pass         http://report_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Health endpoints (no rate-limit) ──────────────────────────────────
    location ~ ^/(health|ready|metrics) {
        proxy_pass http://auth_service;
    }

    # ── Static files (study images and heatmaps) ──────────────────────────
    location /static/studies/ {
        alias /data/studies/;
        expires 1h;
        add_header Access-Control-Allow-Origin "*";
    }

    location /static/heatmaps/ {
        alias /data/heatmaps/;
        expires 1h;
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Frontend SPA ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
