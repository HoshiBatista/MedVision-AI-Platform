name: Python Tests

on:
  push:
    branches: [main]
    paths: ["services/**", "tests/**", "pyproject.toml", ".github/workflows/python-tests.yml"]
  pull_request:
    branches: [main]
    paths: ["services/**", "tests/**", "pyproject.toml", ".github/workflows/python-tests.yml"]
  workflow_dispatch:

concurrency:
  group: py-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, e2e]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medvision
          POSTGRES_PASSWORD: medvision
          POSTGRES_DB: medvision_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medvision"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://medvision:medvision@localhost:5432/medvision_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run ${{ matrix.suite }} suite
        run: |
          set -o pipefail
          # pytest exit code 5 == "no tests collected" treat as neutral pass
          pytest "tests/${{ matrix.suite }}" \
            --cov=services --cov-report=term-missing --cov-report=xml \
            --junitxml="junit-${{ matrix.suite }}.xml" | tee pytest.out || code=$?
          code=${code:-0}
          if [ "$code" -eq 5 ]; then
            echo "NO_TESTS=1" >> "$GITHUB_ENV"
            echo "::notice title=No tests::No tests collected in tests/${{ matrix.suite }} (suite is a placeholder)."
            exit 0
          fi
          exit "$code"

      - name: Test summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.suite }} suite"
            echo ""
            if [ "${NO_TESTS:-0}" = "1" ]; then
              echo "> No tests collected yet — \`tests/${{ matrix.suite }}\` is a placeholder. Add cases to activate coverage gating."
            else
              echo '```'
              tail -n 25 pytest.out 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: env.NO_TESTS != '1'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.suite }}
          path: coverage.xml
          if-no-files-found: ignore
