name: Helm K8s Deploy E2E

# Real in-cluster run: build every service image, spin up a kind cluster,
# deploy the Helm chart, wait for all containers to come up, and smoke-test the
# running stack through the gateway. Proves the whole platform builds and runs
# on Kubernetes (not just that the manifests are valid — see helm-k8s.yml).

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - "infra/helm/**"
      - "triton_models/**"
      - ".github/workflows/helm-k8s-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - "infra/helm/**"
      - "triton_models/**"
      - ".github/workflows/helm-k8s-deploy.yml"
  workflow_dispatch:

concurrency:
  group: helm-k8s-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLUSTER: medvision-ci
  NS: medvision
  RELEASE: medv
  CHART_DIR: infra/helm/medvision
  HELM_VERSION: v3.16.3
  GW_LOCAL_PORT: "8080"

jobs:
  deploy-e2e:
    name: Build images → kind → helm install → smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # NOTE: do not remove $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache) —
        # kind-action / setup-python / setup-helm rely on the tool cache.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/share/swift || true
          docker builder prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all service images (compose → medvision/<svc>:dev)
        run: |
          cp .env.example .env
          docker compose build
          echo "Built images:"; docker images 'medvision/*' --format '  {{.Repository}}:{{.Tag}}'

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: medvision-ci
          wait: 120s

      - name: Load images into kind
        run: |
          for svc in auth_service upload_service analysis_service \
                     gradcam_service report_service frontend gateway; do
            echo "── loading medvision/${svc}:dev"
            kind load docker-image "medvision/${svc}:dev" --name "$CLUSTER"
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Helm install (wait for all workloads ready)
        id: install
        run: |
          helm upgrade --install "$RELEASE" "$CHART_DIR" \
            --namespace "$NS" --create-namespace \
            -f "$CHART_DIR/ci/kind-values.yaml" \
            --wait --timeout 10m
          echo "── workloads"
          kubectl -n "$NS" get deploy,statefulset,pods -o wide

      - name: Populate model repository (ONNX models)
        run: |
          PVC="${RELEASE}-medvision-model-repo"
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: model-loader
          spec:
            restartPolicy: Never
            containers:
              - name: loader
                image: busybox:1.36
                command: ["sh", "-c", "sleep 600"]
                volumeMounts:
                  - { name: models, mountPath: /models }
            volumes:
              - name: models
                persistentVolumeClaim:
                  claimName: ${PVC}
          EOF
          kubectl -n "$NS" wait --for=condition=Ready pod/model-loader --timeout=120s
          kubectl -n "$NS" cp triton_models/. model-loader:/models/
          echo "── model repo contents"
          kubectl -n "$NS" exec model-loader -- find /models -name '*.onnx'
          kubectl -n "$NS" delete pod model-loader --wait=false

      - name: Port-forward gateway + report_service
        run: |
          # Gateway carries the API; report_service is also forwarded on :8005
          # because the e2e suite polls its /ready directly (DIRECT_HOST:8005)
          # to know when the Ollama model has been pulled.
          kubectl -n "$NS" port-forward "svc/${RELEASE}-medvision-gateway" \
            "${GW_LOCAL_PORT}:80" > pf-gw.log 2>&1 &
          echo $! > pf-gw.pid
          kubectl -n "$NS" port-forward "svc/${RELEASE}-medvision-report-service" \
            "8005:8005" > pf-report.log 2>&1 &
          echo $! > pf-report.pid
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:${GW_LOCAL_PORT}/health" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::gateway did not become reachable"; cat pf-gw.log; exit 1; }
          echo "gateway reachable"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test deps
        run: pip install pytest httpx

      - name: Smoke test — gateway health + JWT auth + upload (blocking)
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_READY_TIMEOUT: "120"
        run: |
          pytest tests/e2e -v \
            -k "gateway_health or login or upload_requires_auth"

      - name: Full pipeline — analyze + heatmap + report (best-effort)
        id: pipeline
        continue-on-error: true
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_READY_TIMEOUT: "120"
        run: pytest tests/e2e -v -k "pipeline"

      - name: Diagnostics
        if: always()
        run: |
          echo "===== pods ====="; kubectl -n "$NS" get pods -o wide || true
          echo "===== events ====="; kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -n 40 || true
          echo "===== not-ready describe ====="
          for p in $(kubectl -n "$NS" get pods --field-selector=status.phase!=Running -o name 2>/dev/null); do
            kubectl -n "$NS" describe "$p" || true
          done
          echo "===== recent logs (all deployments) ====="
          for d in $(kubectl -n "$NS" get deploy -o name 2>/dev/null); do
            echo "── $d"; kubectl -n "$NS" logs "$d" --tail=50 --all-containers 2>/dev/null || true
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Helm K8s deploy E2E"
            echo "- Build + kind load + helm install: ${{ steps.install.outcome }}"
            echo "- Full ML/LLM pipeline (best-effort): ${{ steps.pipeline.outcome }}"
            echo ""
            echo '```'
            kubectl -n "$NS" get pods 2>/dev/null || echo "no cluster"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop port-forwards
        if: always()
        run: |
          for f in pf-gw.pid pf-report.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done
