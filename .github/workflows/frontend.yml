name: Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (tsc)
        id: tsc
        run: npm run typecheck

      - name: ESLint
        id: eslint
        if: always()
        run: npm run lint

      - name: Vite build
        id: build
        if: always()
        run: npm run build

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### Frontend (React + TypeScript + Vite)"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Type-check | ${{ steps.tsc.outcome    == 'success' && 'pass' || 'fail' }} |"
            echo "| ESLint     | ${{ steps.eslint.outcome == 'success' && 'pass' || 'fail' }} |"
            echo "| Vite build | ${{ steps.build.outcome  == 'success' && 'pass' || 'fail' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
