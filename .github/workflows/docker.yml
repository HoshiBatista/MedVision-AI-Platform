name: Docker

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint · ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: auth_service,     dockerfile: services/auth_service/Dockerfile }
          - { image: upload_service,   dockerfile: services/upload_service/Dockerfile }
          - { image: analysis_service, dockerfile: services/analysis_service/Dockerfile }
          - { image: gradcam_service,  dockerfile: services/gradcam_service/Dockerfile }
          - { image: report_service,   dockerfile: services/report_service/Dockerfile }
          - { image: gateway,          dockerfile: services/gateway/Dockerfile }
          - { image: frontend,         dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          no-fail: true
          failure-threshold: warning

  build:
    name: Build · ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: hadolint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: auth_service,     context: services/auth_service }
          - { image: upload_service,   context: services/upload_service }
          - { image: analysis_service, context: services/analysis_service }
          - { image: gradcam_service,  context: services/gradcam_service }
          - { image: report_service,   context: services/report_service }
          - { image: gateway,          context: services/gateway }
          - { image: frontend,         context: frontend }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: medvision/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### \`medvision/${{ matrix.image }}\`"
            echo ""
            echo "- Context: \`${{ matrix.context }}\`"
            echo "- Result: ${{ job.status == 'success' && 'built' || 'failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          # Provide the env vars compose interpolates so validation is clean.
          cp .env.example .env 2>/dev/null || true
          docker compose -f docker-compose.yml config > /dev/null
          echo "docker-compose.yml is valid" >> "$GITHUB_STEP_SUMMARY"
