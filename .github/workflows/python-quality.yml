name: Python Quality

on:
  push:
    branches: [main]
    paths: ["services/**", "ml/**", "pyproject.toml", ".github/workflows/python-quality.yml"]
  pull_request:
    branches: [main]
    paths: ["services/**", "ml/**", "pyproject.toml", ".github/workflows/python-quality.yml"]
  workflow_dispatch:

concurrency:
  group: py-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth_service,     python: "3.13" }
          - { service: upload_service,   python: "3.13" }
          - { service: analysis_service, python: "3.12" }
          - { service: gradcam_service,  python: "3.11" }
          - { service: report_service,   python: "3.11" }
          - { service: ml,               python: "3.11" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Ruff
        run: pipx install ruff==0.7.4

      - name: Ruff lint (annotated)
        id: lint
        run: ruff check ${{ matrix.service }} --output-format=github

      - name: Ruff format check
        if: always()
        id: fmt
        continue-on-error: true # formatting is auto-fixable; advisory only
        run: ruff format --check --diff ${{ matrix.service }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ruff — \`${{ matrix.service }}\` (py${{ matrix.python }})"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint   | ${{ steps.lint.outcome == 'success' && 'pass' || 'fail' }} |"
            echo "| Format | ${{ steps.fmt.outcome  == 'success' && 'pass' || 'fail' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  mypy:
    name: mypy · ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Type-checking is advisory for now (strict mode surfaces many findings).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth_service,     python: "3.13" }
          - { service: upload_service,   python: "3.13" }
          - { service: analysis_service, python: "3.12" }
          - { service: gradcam_service,  python: "3.11" }
          - { service: report_service,   python: "3.11" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install mypy
        run: pipx install mypy==1.13.0

      - name: Run mypy
        working-directory: services/${{ matrix.service }}
        run: mypy app --ignore-missing-imports --config-file ../../pyproject.toml | tee mypy.out

      - name: Summary
        if: always()
        working-directory: services/${{ matrix.service }}
        run: |
          {
            echo "### mypy — \`${{ matrix.service }}\`"
            echo ""
            echo '```'
            tail -n 30 mypy.out 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
