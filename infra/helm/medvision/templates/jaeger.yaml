{{- if .Values.jaeger.enabled }}
{{- $full := include "medvision.fullname" . -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-jaeger
  labels:
    {{- include "medvision.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "medvision.selectorLabels" (dict "ctx" . "component" "jaeger") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medvision.podLabels" (dict "ctx" . "component" "jaeger") | nindent 8 }}
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-http
              containerPort: {{ .Values.jaeger.otlpHttpPort }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-jaeger
  labels:
    {{- include "medvision.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  selector:
    {{- include "medvision.selectorLabels" (dict "ctx" . "component" "jaeger") | nindent 4 }}
  ports:
    - name: ui
      port: {{ .Values.jaeger.uiPort }}
      targetPort: ui
    - name: otlp-http
      port: {{ .Values.jaeger.otlpHttpPort }}
      targetPort: otlp-http
{{- end }}
