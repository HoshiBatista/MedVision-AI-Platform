{{- if .Values.triton.enabled }}
{{- $full := include "medvision.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-triton
  labels:
    {{- include "medvision.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "medvision.selectorLabels" (dict "ctx" . "component" "triton") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.triton.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.triton.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.triton.metricsPort }}
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-triton
  labels:
    {{- include "medvision.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "medvision.selectorLabels" (dict "ctx" . "component" "triton") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medvision.podLabels" (dict "ctx" . "component" "triton") | nindent 8 }}
    spec:
      containers:
        - name: triton
          image: {{ .Values.triton.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - tritonserver
            - --model-repository=/models
            - --http-port={{ .Values.triton.httpPort }}
            - --grpc-port={{ .Values.triton.grpcPort }}
            - --metrics-port={{ .Values.triton.metricsPort }}
            - --log-verbose=0
          ports:
            - name: http
              containerPort: {{ .Values.triton.httpPort }}
            - name: grpc
              containerPort: {{ .Values.triton.grpcPort }}
            - name: metrics
              containerPort: {{ .Values.triton.metricsPort }}
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- $res := deepCopy .Values.triton.resources }}
            {{- $_ := set $res "limits" (mergeOverwrite (default (dict) $res.limits) (dict "nvidia.com/gpu" .Values.triton.gpuCount)) }}
            {{- toYaml $res | nindent 12 }}
          volumeMounts:
            - name: model-repo
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-repo
          persistentVolumeClaim:
            claimName: {{ $full }}-model-repo
{{- end }}
