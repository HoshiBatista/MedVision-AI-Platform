{{- if .Values.gateway.enabled }}
{{- $full := include "medvision.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-gateway-conf
  labels:
    {{- include "medvision.labels" . | nindent 4 }}
data:
  # Mirrors services/gateway/nginx.conf but with in-cluster Service names
  # (K8s DNS labels can't contain underscores, so the baked conf won't resolve).
  default.conf: |
    upstream auth_service     { server {{ $full }}-auth-service:8001;     }
    upstream upload_service   { server {{ $full }}-upload-service:8002;   }
    upstream analysis_service { server {{ $full }}-analysis-service:8003; }
    upstream gradcam_service  { server {{ $full }}-gradcam-service:8004;  }
    upstream report_service   { server {{ $full }}-report-service:8005;   }
    upstream frontend         { server {{ $full }}-frontend:3000;         }

    limit_req_zone $binary_remote_addr zone=auth_rl:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=refresh_rl:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=upload_rl:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_rl:10m     rate=120r/m;

    server {
        listen 80;
        server_name _;

        client_max_body_size 512M;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        limit_req_status 429;

        location /api/v1/auth/refresh {
            limit_req zone=refresh_rl burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/auth/ {
            limit_req zone=auth_rl burst=5 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/users/ {
            limit_req zone=api_rl burst=20 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/admin/ {
            limit_req zone=api_rl burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/upload {
            limit_req zone=upload_rl burst=10 nodelay;
            proxy_pass         http://upload_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/analyze {
            limit_req zone=api_rl burst=20 nodelay;
            proxy_pass         http://analysis_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/results/ {
            limit_req zone=api_rl burst=30 nodelay;
            proxy_pass         http://analysis_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/explain {
            limit_req zone=api_rl burst=10 nodelay;
            proxy_pass         http://gradcam_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/reports/ {
            limit_req zone=api_rl burst=10 nodelay;
            proxy_pass         http://report_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location ~ ^/(health|ready|metrics) {
            proxy_pass http://auth_service;
        }
        location /static/studies/ {
            alias /data/studies/;
            expires 1h;
            add_header Access-Control-Allow-Origin "*";
        }
        location /static/heatmaps/ {
            alias /data/heatmaps/;
            expires 1h;
            add_header Access-Control-Allow-Origin "*";
        }
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
{{- end }}
